<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>HTML5 e CSS3</title>
    <!-- CSS -->
    <style>
        .pai {
            width: 240px;
            background-color: rgb(236, 209, 171);
        }

        .filho { float: left; }

        .caixa-80 { width: 80px; height: 80px; }
        .caixa-160 { width: 160px; height: 160px; }

        .cor-1 { background-color: dodgerblue; }
        .cor-2 { background-color: aqua; }
        .cor-3 { background-color: cadetblue; }
        .cor-4 { background-color: coral; }

        .clear-both { clear: both; }
    </style>
</head>

<body>
    
    <div class="pai">
        
        <div class="filho caixa-80 cor-1">1</div>
        <div class="filho caixa-80 cor-2">2</div>
        <div class="filho caixa-80 cor-3">3</div>
        <div class="filho caixa-160 cor-4">4</div>
        <div class="clear-both"></div>

    </div>
    
</body>

</html>
